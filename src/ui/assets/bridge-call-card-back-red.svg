<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 840" role="img" aria-labelledby="title desc" data-variant="red">
  <title id="title">Contract bridge card back pattern</title>
  <desc id="desc">A symmetrical red and ivory card back with a fine diamond weave, ornamental border, and four-suit medallion. Set data-variant to blue for a blue palette.</desc>
  <style>
    svg { --field: #B51F3A; --field-dark: #86172F; --line: #FFF4E4; --accent: #E9B77D; --shadow: #5F1427; }
    svg[data-variant="blue"] { --field: #285A9B; --field-dark: #183B70; --line: #F3F5F7; --accent: #B9D6EC; --shadow: #10294E; }
  </style>
  <defs>
    <pattern id="weave" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="translate(-8 0)">
      <rect width="56" height="56" fill="var(--field-dark)"/>
      <path d="M-14 14L14-14M0 56L56 0M42 70L70 42M-14 42L14 70M0 0L56 56M42-14L70 14" fill="none" stroke="var(--line)" stroke-width="1.25" opacity=".2"/>
      <path d="M28 5L51 28 28 51 5 28Z" fill="none" stroke="var(--accent)" stroke-width="1.15" opacity=".68"/>
      <path d="M28 15L41 28 28 41 15 28Z" fill="none" stroke="var(--line)" stroke-width=".9" opacity=".55"/>
      <path d="M28 23L33 28 28 33 23 28Z" fill="var(--accent)" opacity=".82"/>
    </pattern>
    <symbol id="suit-heart" viewBox="0 0 32 30">
      <path d="M16 28C13.4 25.4 2 16.3 2 9.5 2 4.8 5.3 2 9.1 2c3.1 0 5.5 1.9 6.9 4.7C17.4 3.9 19.8 2 22.9 2 26.7 2 30 4.8 30 9.5 30 16.3 18.6 25.4 16 28Z" fill="currentColor"/>
    </symbol>
    <symbol id="suit-spade" viewBox="-4 0 40 34">
      <path d="M16 2C12.4 7.3 2 13.1 2 21c0 4.5 3.3 7.2 7.2 7.2 3.5 0 5.9-2.4 6.8-5.7.5 3.5-.2 6.1-2.3 8.7h8.6c-2.1-2.6-2.8-5.2-2.3-8.7.9 3.3 3.3 5.7 6.8 5.7 3.9 0 7.2-2.7 7.2-7.2C30 13.1 19.6 7.3 16 2Z" fill="currentColor"/>
    </symbol>
    <symbol id="suit-diamond" viewBox="0 0 28 36">
      <path d="M14 1L27 18 14 35 1 18Z" fill="currentColor"/>
    </symbol>
    <symbol id="suit-club" viewBox="0 0 34 34">
      <path d="M17 2C12.8 2 9.8 5.1 9.8 9c0 2.1 1 4.1 2.8 5.2-1-.5-2.1-.8-3.3-.8-4.2 0-7.3 3.1-7.3 7.4s3.1 7.4 7.3 7.4c3.1 0 5.5-1.9 6.7-4.6.2 3.4-.7 6.4-3 9.4h8c-2.3-3-3.2-6-3-9.4 1.2 2.7 3.6 4.6 6.7 4.6 4.2 0 7.3-3.1 7.3-7.4s-3.1-7.4-7.3-7.4c-1.2 0-2.3.3-3.3.8 1.8-1.1 2.8-3.1 2.8-5.2 0-3.9-3-7-7.2-7Z" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- Card ground and full-bleed woven field -->
  <rect width="600" height="840" rx="30" fill="var(--line)"/>
  <rect x="16" y="16" width="568" height="808" rx="24" fill="var(--field)"/>
  <rect x="36" y="36" width="528" height="768" rx="16" fill="url(#weave)"/>

  <!-- Fine ornamental rails -->
  <rect x="43" y="43" width="514" height="754" rx="13" fill="none" stroke="var(--line)" stroke-width="1.5" opacity=".9"/>
  <rect x="51" y="51" width="498" height="738" rx="10" fill="none" stroke="var(--accent)" stroke-width="1" opacity=".8"/>

  <!-- Central symmetrical bridge medallion -->
  <path d="M300 274L425 420 300 566 175 420Z" fill="var(--shadow)" opacity=".52"/>
  <path d="M300 264L420 420 300 576 180 420Z" fill="var(--field)" stroke="var(--line)" stroke-width="2.2"/>
  <path d="M300 282L405 420 300 558 195 420Z" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  <path d="M300 302L390 420 300 538 210 420Z" fill="url(#weave)" stroke="var(--line)" stroke-width="1.2"/>
  <circle cx="300" cy="420" r="67" fill="var(--field-dark)" stroke="var(--line)" stroke-width="2.2"/>
  <circle cx="300" cy="420" r="58" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
  <circle cx="300" cy="420" r="49" fill="none" stroke="var(--line)" stroke-width=".9" opacity=".74"/>
  <g color="var(--line)">
    <use xlink:href="#suit-spade" x="277.65" y="379" width="44.7" height="38"/>
    <use xlink:href="#suit-heart" x="260" y="409" width="30" height="28"/>
    <use xlink:href="#suit-diamond" x="293" y="411" width="14" height="19"/>
    <use xlink:href="#suit-club" x="310" y="409" width="30" height="30"/>
    <use xlink:href="#suit-diamond" x="288" y="436" width="24" height="31"/>
  </g>
</svg>
