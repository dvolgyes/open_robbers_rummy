<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>P2P phone probe</title>
		<style>
			:root {
				--bg: #f7f7f5;
				--fg: #1d1d1b;
				--muted: #5f5f5a;
				--card: #ffffff;
				--line: #d9d9d4;
				--ok: #1e7a3c;
				--wait: #8a6a00;
				--bad: #b3261e;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #161615;
					--fg: #ececea;
					--muted: #a4a49e;
					--card: #20201f;
					--line: #3a3a37;
					--ok: #6fcf8e;
					--wait: #e3c35a;
					--bad: #f2867e;
				}
			}
			body {
				margin: 0;
				padding: 16px;
				background: var(--bg);
				color: var(--fg);
				font: 16px/1.4 system-ui, sans-serif;
			}
			h1 {
				font-size: 1.2rem;
				margin: 0 0 12px;
			}
			#status {
				font-size: 1.15rem;
				font-weight: 600;
				padding: 12px;
				border-radius: 8px;
				background: var(--card);
				border: 2px solid var(--line);
			}
			#status[data-tone="ok"] {
				border-color: var(--ok);
				color: var(--ok);
			}
			#status[data-tone="wait"] {
				border-color: var(--wait);
				color: var(--wait);
			}
			#status[data-tone="bad"] {
				border-color: var(--bad);
				color: var(--bad);
			}
			dl {
				display: grid;
				grid-template-columns: max-content 1fr;
				gap: 4px 12px;
				margin: 12px 0;
			}
			dt {
				color: var(--muted);
			}
			dd {
				margin: 0;
				overflow-wrap: anywhere;
			}
			h2 {
				font-size: 1rem;
				margin: 16px 0 4px;
			}
			ol {
				margin: 0;
				padding-left: 20px;
				color: var(--muted);
				font-size: 0.9rem;
			}
		</style>
		<!--PROBE_CONFIG-->
	</head>
	<body>
		<h1>P2P phone probe</h1>
		<div id="status" data-tone="wait">Starting…</div>
		<dl id="facts"></dl>
		<h2>Peers</h2>
		<dl id="peers"></dl>
		<h2>Log</h2>
		<ol id="log"></ol>
		<!--PROBE_SCRIPT-->
	</body>
</html>
